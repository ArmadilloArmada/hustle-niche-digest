# Weekly draft digest — human reviews / approves / exports locally.
# Does NOT send email and does NOT create Buttondown drafts.
name: Weekly niche digest

on:
  schedule:
    # Monday 14:05 UTC (staggered after RFP alerts)
    - cron: "5 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure config.yaml
        run: |
          if [ ! -f config.yaml ]; then
            cp config.example.yaml config.yaml
          fi

      - name: Run digest pipeline (draft only)
        # Template draft — no OPENAI_API_KEY required for a usable pack.
        run: PYTHONPATH=src python -m niche_digest run --config config.yaml --out-dir out

      - name: Upload out/ as draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: niche-digest-draft
          path: out/
          if-no-files-found: error
          retention-days: 14
